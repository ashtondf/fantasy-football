services:
  dashboard:
    build: .
    image: fantasy-league:local
    container_name: fantasy-league
    ports:
      - "8501:8501"
    environment:
      - FANTASY_DATA_DIR=/data
    volumes:
      - dashboard-data:/data
    restart: unless-stopped

  # One-shot data refresh: docker compose run --rm data-pull
  data-pull:
    build: .
    image: fantasy-league:local
    entrypoint: ["sleeper-pull"]
    environment:
      - FANTASY_DATA_DIR=/data
    volumes:
      - dashboard-data:/data

volumes:
  dashboard-data: